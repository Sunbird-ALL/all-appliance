<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="form-control"
          placeholder="Enter your username"
        />
        <div *ngIf="loginForm.get('username').touched && loginForm.get('username').hasError('required')" class="error-message">
          Username is required.
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Enter your password"
        />
        <div *ngIf="loginForm.get('password').touched && loginForm.get('password').hasError('required')" class="error-message">
          Password is required.
        </div>
      </div>
      <button type="submit" class="login-button" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
</div>
